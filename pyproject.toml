[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccercards"
version = "0.1.0"
description = "Soccer trading card secondary market valuation tool"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
